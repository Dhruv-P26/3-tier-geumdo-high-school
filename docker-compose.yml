version: "3.9"

services:

  # ---------- Tier 1: Presentation (Nginx + static frontend) ----------
  frontend:
    build: ./frontend
    image: geumdo-frontend:latest
    container_name: geumdo-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - geumdo-net
    restart: unless-stopped

  # ---------- Tier 2: Application / API (Node.js + Express) ----------
  backend:
    build: ./backend
    image: geumdo-backend:latest
    container_name: geumdo-backend
    environment:
      PORT: 5000
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: geumdo_user
      DB_PASSWORD: geumdo_pass
      DB_NAME: geumdo_db
    depends_on:
      db:
        condition: service_healthy
    networks:
      - geumdo-net
    restart: unless-stopped

  # ---------- Tier 3: Database (MySQL) ----------
  db:
    image: mysql:8.0
    container_name: geumdo-db
    environment:
      MYSQL_ROOT_PASSWORD: root_pass_change_me
      MYSQL_DATABASE: geumdo_db
      MYSQL_USER: geumdo_user
      MYSQL_PASSWORD: geumdo_pass
    volumes:
      - geumdo-db-data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_pass_change_me"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - geumdo-net
    restart: unless-stopped

networks:
  geumdo-net:
    driver: bridge

volumes:
  geumdo-db-data:
